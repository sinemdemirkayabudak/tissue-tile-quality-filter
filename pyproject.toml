[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tissue-tile-quality-filter"
version = "0.1.0"
description = "A Python pipeline for histology image tile quality filtering with blur detection and tissue coverage analysis"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "opencv-python>=4.8.0",
    "pydantic>=2.0.0",
    "pandas>=2.0.0",
    "pyarrow>=14.0.0",
    "Pillow>=10.0.0",
    "python-dotenv>=1.0.0",
    "click>=8.0.0",
]

[project.scripts]
tissue-tile-quality-filter = "tissue_tile_quality_filter:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/tissue_tile_quality_filter"]

[dependency-groups]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "prek>=0.3.12",
    "ty>=0.0.34",
]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".git", "__pycache__", ".venv", "dist", "build"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# Import sorting via Ruff (I rule - already enabled above)
[tool.isort]
profile = "black"
line_length = 100
skip_gitignore = true
known_first_party = ["app"]


[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-v --cov=src/tissue_tile_quality_filter --cov-report=term-missing --cov-report=html"
testpaths = ["tests"]

[tool.coverage.run]
source = ["src/tissue_tile_quality_filter"]
